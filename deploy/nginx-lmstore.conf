# Configuracao do nginx para servir a Lojinha da Miih (site estatico).
# Dominio de staging atual: lmstore.veraxlegalops.com.br
# Pasta servida (webroot): /var/www/lmstore
#
# Este arquivo e uma referencia versionada. No VPS, o script deploy/setup-vps.sh
# gera esta mesma configuracao automaticamente. Para HTTPS, rode o certbot
# (veja o README), que adiciona o bloco 443 e o redirecionamento sozinho.

server {
    listen 80;
    listen [::]:80;

    server_name lmstore.veraxlegalops.com.br;

    root /var/www/lmstore;
    index index.html;

    # Site estatico multipagina (Astro com format "directory"):
    # /catalogo -> /catalogo/index.html. O try_files cobre esses casos.
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Assets com hash no nome podem ser cacheados por bastante tempo.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Compacta texto para carregar mais rapido.
    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/xml;
}
