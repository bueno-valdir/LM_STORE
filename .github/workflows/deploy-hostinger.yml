# Publica a versao do site para o VPS Hostinger SEM precisar de SSH/porta aberta.
#
# Em vez de enviar por SSH (que exige a porta 22 aberta), este fluxo builda o
# site na raiz do dominio e publica numa branch "deploy-hostinger". O VPS busca
# (git pull) essa branch sozinho, por um cron. Como o repositorio e publico,
# nao precisa de credenciais no servidor.
#
# So roda quando a variavel DEPLOY_ENABLED estiver "true".
#
# Variaveis (Actions > Variables):
#   DEPLOY_ENABLED -> "true" para ligar
#   SITE_URL       -> dominio publico (ex.: https://lmstore.veraxlegalops.com.br)
name: Deploy na Hostinger (VPS)

on:
  push:
    branches:
      - claude/fervent-allen-VGls2
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-hostinger
  cancel-in-progress: true

jobs:
  publicar:
    name: Build e publicacao da branch do VPS
    runs-on: ubuntu-latest
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Gerar o site (servido na raiz do dominio)
        env:
          SITE_BASE: "/"
          SITE_URL: ${{ vars.SITE_URL }}
        run: npm run build

      - name: Publicar na branch deploy-hostinger
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: deploy-hostinger
          force_orphan: true
          commit_message: "Build do site para o VPS"
