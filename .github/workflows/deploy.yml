# Publica a PREVIA no GitHub Pages a cada push na branch "dev".
# Builda o site (Astro) e envia o resultado para a branch "gh-pages",
# que o GitHub Pages serve. Serve como ambiente de previa/homologacao.
name: Publicar previa (GitHub Pages)

on:
  # Roda quando houver push na branch de desenvolvimento (previa).
  push:
    branches:
      - dev
      - painel-conteudo
  # Permite acionar manualmente pelo botao "Run workflow" na aba Actions.
  workflow_dispatch:

# Permissao para o fluxo escrever a branch gh-pages.
permissions:
  contents: write

# Uma publicacao por vez.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    name: Build e publicacao
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Gerar o site estatico
        run: npm run build

      - name: Publicar na branch gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          # Mensagem de commit da publicacao.
          commit_message: "Publicacao automatica do site"
