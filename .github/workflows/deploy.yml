# Publica o site no GitHub Pages automaticamente a cada push.
# Faz o build estatico (Astro) e envia o resultado para o Pages.
name: Publicar no GitHub Pages

on:
  # Roda quando houver push na branch de desenvolvimento atual.
  push:
    branches:
      - claude/fervent-allen-VGls2
  # Permite acionar manualmente pelo botao "Run workflow" na aba Actions.
  workflow_dispatch:

# Permissoes necessarias para publicar no Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Garante uma publicacao por vez, sem cancelar uma que ja esteja rodando.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build do site
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Gerar o site estatico
        run: npm run build

      - name: Configurar o Pages
        uses: actions/configure-pages@v5

      - name: Enviar artefato do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Publicar
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
